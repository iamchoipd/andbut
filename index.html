<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             viewport-fit=cover"
>

<title>이어주는 말 달리기</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --blue: #2775ff;
    --green: #14a66a;
    --red: #e84b4b;
    --yellow: #ffc83d;
    --dark: #233044;
    --bg: #f2f6fb;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    background: var(--bg);
    color: var(--dark);
}

body {
    min-height: 100dvh;
    overflow-x: hidden;
}

button,
select {
    font: inherit;
}


/* =========================================
   설정 화면
========================================= */

#setupScreen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.setup-box {
    width: min(620px, 100%);
    background: white;
    border-radius: 28px;
    padding: 32px;
    box-shadow: 0 14px 40px rgba(0,0,0,.12);
}

.title {
    text-align: center;
    font-size: clamp(30px, 7vw, 52px);
    font-weight: 900;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    font-size: 18px;
    color: #647084;
    line-height: 1.6;
    margin-bottom: 30px;
}

.setting-group {
    margin: 20px 0;
}

.setting-group label {
    display: block;
    font-weight: 800;
    font-size: 19px;
    margin-bottom: 8px;
}

.setting-group select {
    width: 100%;
    padding: 16px;
    border: 2px solid #dce3ed;
    border-radius: 15px;
    background: white;
    font-size: 20px;
    font-weight: 800;
    outline: none;
}

.setting-group select:focus {
    border-color: var(--blue);
}

.rule-box {
    margin-top: 24px;
    background: #f4f8ff;
    border-radius: 18px;
    padding: 17px 20px;
    line-height: 1.8;
    font-size: 15px;
}

.rule-box strong {
    color: var(--blue);
}

#startBtn {
    width: 100%;
    border: 0;
    border-radius: 18px;
    padding: 19px;
    margin-top: 24px;
    background: var(--blue);
    color: white;
    font-size: 27px;
    font-weight: 900;
    cursor: pointer;
    touch-action: manipulation;
}

#startBtn:active {
    transform: scale(.98);
}


/* =========================================
   게임 전체
========================================= */

#gameScreen {
    display: none;
    min-height: 100dvh;
}


/* =========================================
   위쪽 경기장
========================================= */

#raceArea {
    position: sticky;
    top: 0;
    z-index: 50;
    background: white;
    border-bottom: 3px solid #dbe2eb;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);

    padding:
        max(8px, env(safe-area-inset-top))
        12px
        10px;
}

.race-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
}

.race-title {
    font-weight: 900;
    font-size: clamp(17px, 3vw, 24px);
}

.race-controls {
    display: flex;
    gap: 6px;
}

.small-btn {
    border: 0;
    background: #edf2f8;
    color: #344054;
    border-radius: 10px;
    padding: 8px 12px;
    font-weight: 800;
    cursor: pointer;
}

#tracks {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.track-row {
    display: grid;
    grid-template-columns: 56px 1fr 60px;
    align-items: center;
    gap: 6px;
    min-height: 35px;
}

.track-name {
    text-align: center;
    font-weight: 900;
    white-space: nowrap;
    font-size: 14px;
}

.track {
    position: relative;
    height: 28px;
    border-radius: 14px;

    background:
        repeating-linear-gradient(
            90deg,
            #f0f3f8 0,
            #f0f3f8 9%,
            #e3e8f0 9%,
            #e3e8f0 10%
        );

    border: 2px solid #d9e0e9;
}

.runner {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translate(-10%, -50%);
    font-size: 27px;

    transition:
        left .6s cubic-bezier(.22,.8,.28,1.2),
        transform .25s;

    z-index: 2;
}

.runner.jump {
    transform: translate(-10%, -80%) scale(1.18);
}

.runner.returning {
    transition: left 1.1s cubic-bezier(.7,0,.3,1);
}

.finish-flag {
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 22px;
}

.track-time {
    text-align: center;
    font-size: 13px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}


/* =========================================
   문제 영역
========================================= */

#playersScroller {
    width: 100%;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    padding: 12px;
    -webkit-overflow-scrolling: touch;
}

#playersArea {
    display: flex;
    align-items: stretch;
    gap: 12px;
    min-height: calc(100dvh - 220px);
}

.player-card {
    flex:
        0 0
        calc(
            (100% - ((var(--player-count) - 1) * 12px))
            / var(--player-count)
        );

    min-width: 0;
    position: relative;

    background: white;
    border-radius: 22px;
    border: 3px solid transparent;
    padding: 14px;

    display: flex;
    flex-direction: column;

    scroll-snap-align: center;

    box-shadow: 0 5px 18px rgba(0,0,0,.08);
    overflow: hidden;
}

.player-card.correct-flash {
    animation: correctFlash .55s ease;
}

.player-card.wrong-flash {
    animation: wrongFlash .55s ease;
}

@keyframes correctFlash {
    0% {
        border-color: transparent;
    }

    30% {
        border-color: #2ac67d;
        background: #eafff4;
    }

    100% {
        border-color: transparent;
    }
}

@keyframes wrongFlash {
    0% {
        border-color: transparent;
    }

    30% {
        border-color: #ff6767;
        background: #fff0f0;
    }

    100% {
        border-color: transparent;
    }
}

.player-top {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    align-items: center;
    margin-bottom: 10px;
}

.player-label {
    font-weight: 900;
    font-size: clamp(17px, 2vw, 24px);
}

.player-progress {
    font-weight: 900;
    color: var(--blue);
    font-size: 15px;
}

.question-box {
    background: #f7f9fc;
    border-radius: 18px;
    padding: 18px 12px;
    margin-bottom: 12px;

    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 170px;
}

.question {
    text-align: center;
    font-size: clamp(19px, 2.1vw, 29px);
    font-weight: 800;
    line-height: 1.65;
    word-break: keep-all;
}

.blank {
    display: inline-block;
    padding: 1px 12px 3px;
    margin: 5px;
    border-radius: 10px;

    background: #fff1b9;
    color: #805c00;

    font-weight: 900;
}

.status {
    text-align: center;
    font-weight: 900;
    min-height: 31px;
    margin: 3px 0 9px;
    color: #5a6576;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.answer-btn {
    width: 100%;
    min-height: 58px;

    border: 0;
    border-radius: 15px;

    background: #eaf1ff;
    color: #165ed1;

    font-size: clamp(20px, 2.2vw, 28px);
    font-weight: 900;

    cursor: pointer;
    touch-action: manipulation;
    user-select: none;

    transition:
        transform .15s,
        opacity .25s;
}

.answer-btn:nth-child(2) {
    background: #fff1e4;
    color: #bc6018;
}

.answer-btn:nth-child(3) {
    background: #e7f8ef;
    color: #087848;
}

.answer-btn:active:not(:disabled) {
    transform: scale(.97);
}

.answer-btn:disabled {
    opacity: .38;
    cursor: default;
}

/* 첫 오답 보기 제거 */
.answer-btn.removed {
    display: none;
}

.penalty-overlay {
    position: absolute;
    inset: 0;
    z-index: 20;

    background: rgba(25,33,47,.86);
    color: white;

    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 20px;
}

.penalty-overlay.show {
    display: flex;
}

.penalty-icon {
    font-size: 58px;
}

.penalty-text {
    font-size: clamp(22px, 3vw, 36px);
    font-weight: 900;
    margin: 10px 0;
}

.penalty-count {
    font-size: 60px;
    font-weight: 900;
    color: #ffd84d;
}

.finish-card {
    background: linear-gradient(
        180deg,
        #fff,
        #fff9da
    );
}

.finish-message {
    text-align: center;
    font-size: clamp(25px, 3vw, 40px);
    font-weight: 900;
    line-height: 1.5;
}

.finish-time-big {
    color: #176ada;
    font-size: clamp(31px, 5vw, 55px);
    font-weight: 900;
}


/* =========================================
   시작 카운트다운
========================================= */

#countdownOverlay {
    display: none;

    position: fixed;
    inset: 0;
    z-index: 1000;

    background: rgba(17,25,38,.88);

    align-items: center;
    justify-content: center;

    color: white;
}

#countdownOverlay.show {
    display: flex;
}

#countdownText {
    font-size: clamp(90px, 25vw, 220px);
    font-weight: 1000;
    text-shadow: 0 8px 35px rgba(0,0,0,.4);
}

.countdown-start {
    font-size: clamp(55px, 15vw, 140px) !important;
    color: #ffe44f;
}


/* =========================================
   최종 결과
========================================= */

#resultOverlay {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;
    z-index: 1500;

    background: rgba(13,20,32,.85);
}

#resultOverlay.show {
    display: flex;
}

.result-box {
    width: min(550px, 100%);
    max-height: 90dvh;

    overflow-y: auto;

    background: white;
    border-radius: 27px;
    padding: 27px;

    text-align: center;
}

.result-title {
    font-size: 35px;
    font-weight: 1000;
    margin-bottom: 18px;
}

.result-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;

    background: #f4f7fb;

    border-radius: 13px;
    padding: 13px 15px;
    margin: 8px 0;

    font-weight: 900;
}

.result-actions {
    display: flex;
    gap: 9px;
    margin-top: 20px;
}

.result-actions button {
    flex: 1;
    padding: 15px;

    border: 0;
    border-radius: 14px;

    font-weight: 900;
    font-size: 17px;
}

#againBtn {
    background: var(--blue);
    color: white;
}

#setupBtn {
    background: #e8edf4;
    color: #384559;
}


/* =========================================
   모바일
========================================= */

@media (max-width: 800px) {

    #raceArea {
        padding-left: 7px;
        padding-right: 7px;
    }

    .race-header {
        margin-bottom: 4px;
    }

    .track-row {
        grid-template-columns: 46px 1fr 52px;
        gap: 3px;
        min-height: 31px;
    }

    .track {
        height: 24px;
    }

    .runner {
        font-size: 24px;
    }

    .finish-flag {
        font-size: 18px;
    }

    .track-time {
        font-size: 11px;
    }

    #playersScroller {
        padding: 9px;
    }

    #playersArea {
        gap: 8px;
    }

    .player-card {
        flex: 0 0 92vw;
        min-height: calc(100dvh - 190px);
        padding: 12px;
    }

    #playersArea[data-count="1"] .player-card {
        flex-basis: calc(100vw - 18px);
    }

    .question-box {
        min-height: 170px;
    }

    .answer-btn {
        min-height: 64px;
    }
}


/* 세로가 짧은 휴대폰 */
@media (max-height: 700px) {

    .question-box {
        min-height: 120px;
        padding: 10px;
    }

    .answer-btn {
        min-height: 49px;
    }

    .status {
        margin-bottom: 4px;
    }
}

</style>
</head>

     설정 화면

<!-- =====================================

===================================== -->

<div id="gameScreen">

/* =========================================================
   음향
========================================================= */

function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;
}


function tone(
    frequency,
    duration = 0.15,
    type = "sine",
    volume = 0.18,
    delay = 0
) {

    const ctx = getAudioContext();

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type = type;
    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(
        0.0001,
        ctx.currentTime + delay
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        ctx.currentTime + delay + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        ctx.currentTime + delay + duration
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(
        ctx.currentTime + delay
    );

    osc.stop(
        ctx.currentTime +
        delay +
        duration +
        .03
    );
}

    const frequencies = {
        3: 440,
        2: 500,
        1: 580
    };

    tone(
        frequencies[number],
        .16,
        "sine",
        .16
    );
}

/* 출발점 복귀 */
function playReturnSound() {

    const ctx =
        getAudioContext();

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        650,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        110,
        ctx.currentTime + .8
    );

    gain.gain.setValueAtTime(
        .10,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .85
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
        ctx.currentTime + .9
    );
}

        [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];
    }

    return result;
}


function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


function formatTime(milliseconds) {

    const totalTenths =
        Math.floor(
            milliseconds / 100
        );

    const minutes =
        Math.floor(
            totalTenths / 600
        );

    const seconds =
        Math.floor(
            (totalTenths % 600) / 10
        );

    const tenths =
        totalTenths % 10;

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0") +
        "." +
        tenths
    );
}


/* =========================================================
   게임 시작
========================================================= */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        startGame
    );


async function startGame() {

    playerCount =
        Number(
            document
                .getElementById(
                    "playerCount"
                )
                .value
        );

    goalCount =
        Number(
            document
                .getElementById(
                    "goalCount"
                )
                .value
        );

    const ctx =
        getAudioContext();

    if (
        ctx.state === "suspended"
    ) {

        await ctx.resume();

    }

    buildGame();

    document
        .getElementById(
            "setupScreen"
        )
        .style.display =
        "none";

    document
        .getElementById(
            "gameScreen"
        )
        .style.display =
        "block";

    await startCountdown();

    beginRace();
}


/* =========================================================
   게임 구성
========================================================= */

function buildGame() {

    clearInterval(
        timerInterval
    );

    document
        .getElementById(
            "resultOverlay"
        )
        .classList
        .remove(
            "show"
        );


    const tracks =
        document
            .getElementById(
                "tracks"
            );

    const playersArea =
        document
            .getElementById(
                "playersArea"
            );


    tracks.innerHTML = "";
    playersArea.innerHTML = "";


    playersArea.style.setProperty(
        "--player-count",
        playerCount
    );

    playersArea.dataset.count =
        playerCount;


    players = [];


    for (
        let i = 0;
        i < playerCount;
        i++
    ) {

        const order =
            shuffle(
                Array.from(
                    {
                        length:
                            QUESTIONS.length
                    },
                    (_, index) =>
                        index
                )
            );


        const player = {

            id: i,

            name:
                `${i + 1}번`,

            character:
                CHARACTERS[i],

            position: 0,

            wrongCount: 0,

            questionIndex:
                null,

            questionOrder:
                order,

            questionCursor:
                0,

            locked:
                true,

            finished:
                false,

            finishTime:
                null

        };


        players.push(
            player
        );


        createTrack(
            player
        );


        createPlayerCard(
            player
        );

    }
}


/* =========================================================
   트랙
========================================================= */

function createTrack(player) {

    const row =
        document
            .createElement(
                "div"
            );

    row.className =
        "track-row";


    row.innerHTML = `

        <div class="track-name">

            ${player.name}

        </div>


        <div class="track">

            <div
                class="runner"
                id="runner-${player.id}"
            >
                ${player.character}
            </div>

            <div class="finish-flag">
                🏁
            </div>

        </div>


        <div
            class="track-time"
            id="track-time-${player.id}"
        >
            00:00.0
        </div>

    `;


    document
        .getElementById(
            "tracks"
        )
        .appendChild(
            row
        );
}


/* =========================================================
   플레이어 카드
========================================================= */

function createPlayerCard(player) {

    const card =
        document
            .createElement(
                "div"
            );

    card.className =
        "player-card";

    card.id =
        `player-card-${player.id}`;


    card.innerHTML = `

        <div class="player-top">

            <div class="player-label">

                ${player.character}
                ${player.name}

            </div>

            <div
                class="player-progress"
                id="progress-${player.id}"
            >
                0 / ${goalCount}
            </div>

        </div>


        <div class="question-box">

            <div
                class="question"
                id="question-${player.id}"
            >
                곧 시작합니다!
            </div>

        </div>


        <div
            class="status"
            id="status-${player.id}"
        >
            준비하세요!
        </div>


        <div
            class="answers"
            id="answers-${player.id}"
        >

            ${ANSWERS.map(answer => `

                <button
                    class="answer-btn"
                    disabled
                    data-player="${player.id}"
                    data-answer="${answer}"
                >

                    ${answer}

                </button>

            `).join("")}

        </div>


        <div
            class="penalty-overlay"
            id="penalty-${player.id}"
        >

            <div
                class="penalty-icon"
                id="penalty-icon-${player.id}"
            >
                ⏳
            </div>

            <div
                class="penalty-text"
                id="penalty-text-${player.id}"
            >
                다시 읽어 보세요!
            </div>

            <div
                class="penalty-count"
                id="penalty-count-${player.id}"
            >
                3
            </div>

        </div>

    `;


    document
        .getElementById(
            "playersArea"
        )
        .appendChild(
            card
        );


    card
        .querySelectorAll(
            ".answer-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        answerQuestion(
                            Number(
                                button
                                    .dataset
                                    .player
                            ),
                            button
                                .dataset
                                .answer,
                            button
                        );

                    }
                );

            }
        );
}


/* =========================================================
   시작 카운트다운
========================================================= */

async function startCountdown() {

    const overlay =
        document
            .getElementById(
                "countdownOverlay"
            );

    const text =
        document
            .getElementById(
                "countdownText"
            );


    overlay
        .classList
        .add(
            "show"
        );


    text
        .classList
        .remove(
            "countdown-start"
        );


    for (
        let number = 3;
        number >= 1;
        number--
    ) {

        text.textContent =
            number;


        playCountdownSound(
            number
        );


        text.animate(
            [
                {
                    transform:
                        "scale(.6)",
                    opacity:
                        .5
                },

                {
                    transform:
                        "scale(1.15)",
                    opacity:
                        1
                },

                {
                    transform:
                        "scale(1)",
                    opacity:
                        1
                }
            ],

            {
                duration:
                    700
            }
        );


        await sleep(
            1000
        );
    }


    text.textContent =
        "시작!";


    text
        .classList
        .add(
            "countdown-start"
        );


    playStartSound();


    text.animate(
        [
            {
                transform:
                    "scale(.5)"
            },

            {
                transform:
                    "scale(1.18)"
            },

            {
                transform:
                    "scale(1)"
            }
        ],

        {
            duration:
                600
        }
    );


    await sleep(
        700
    );


    overlay
        .classList
        .remove(
            "show"
        );
}


/* =========================================================
   경기 시작
========================================================= */

function beginRace() {

    gameStartTime =
        performance.now();


    players.forEach(
        player => {

            loadNewQuestion(
                player
            );

        }
    );


    timerInterval =
        setInterval(
            updateTimers,
            100
        );
}


/* =========================================================
   시간
========================================================= */

function updateTimers() {

    const now =
        performance.now();


    players.forEach(
        player => {

            let elapsed;


            if (
                player.finished
            ) {

                elapsed =
                    player.finishTime;

            } else {

                elapsed =
                    now -
                    gameStartTime;

            }


            document
                .getElementById(
                    `track-time-${player.id}`
                )
                .textContent =
                formatTime(
                    elapsed
                );

        }
    );
}


/* =========================================================
   문제 가져오기
========================================================= */

function getNextQuestion(player) {

    if (
        player.questionCursor >=
        player.questionOrder.length
    ) {

        player.questionOrder =
            shuffle(
                Array.from(
                    {
                        length:
                            QUESTIONS.length
                    },

                    (_, index) =>
                        index
                )
            );

        player.questionCursor =
            0;
    }


    const index =
        player.questionOrder[
            player.questionCursor
        ];


    player.questionCursor++;


    return index;
}


/* =========================================================
   새 문제
========================================================= */

function loadNewQuestion(player) {

    if (
        player.finished
    ) {
        return;
    }


    player.questionIndex =
        getNextQuestion(
            player
        );


    player.wrongCount =
        0;


    /* 새 문제에서는 모든 보기 다시 보이기 */
    resetAnswerButtons(
        player
    );


    const question =
        QUESTIONS[
            player.questionIndex
        ];


    const questionElement =
        document
            .getElementById(
                `question-${player.id}`
            );


    questionElement.innerHTML = `

        <div>
            ${question[0]}
        </div>

        <div>

            <span class="blank">
                ______
            </span>

            ${question[1]}

        </div>

    `;


    startReadingLock(
        player
    );
}


/* =========================================================
   보기 초기화
========================================================= */

function resetAnswerButtons(player) {

    const buttons =
        document
            .getElementById(
                `answers-${player.id}`
            )
            .querySelectorAll(
                ".answer-btn"
            );


    buttons.forEach(
        button => {

            button
                .classList
                .remove(
                    "removed"
                );

        }
    );
}


/* =========================================================
   읽기 시간 3초
========================================================= */

async function startReadingLock(player) {

    player.locked =
        true;


    setButtonsEnabled(
        player,
        false
    );


    const status =
        document
            .getElementById(
                `status-${player.id}`
            );


    for (
        let number = 3;
        number >= 1;
        number--
    ) {

        if (
            player.finished
        ) {
            return;
        }


        status.textContent =
            `📖 문장을 읽어요 · ${number}`;


        await sleep(
            1000
        );
    }


    if (
        player.finished
    ) {
        return;
    }


    player.locked =
        false;


    setButtonsEnabled(
        player,
        true
    );


    status.textContent =
        "👉 알맞은 이어주는 말을 선택하세요!";
}


/* =========================================================
   버튼 잠금
========================================================= */

function setButtonsEnabled(
    player,
    enabled
) {

    const buttons =
        document
            .getElementById(
                `answers-${player.id}`
            )
            .querySelectorAll(
                ".answer-btn"
            );


    buttons.forEach(
        button => {

            if (
                !button
                    .classList
                    .contains(
                        "removed"
                    )
            ) {

                button.disabled =
                    !enabled;

            }

        }
    );
}


/* =========================================================
   답 선택
========================================================= */

function answerQuestion(
    playerId,
    selectedAnswer,
    clickedButton
) {

    const player =
        players[
            playerId
        ];


    if (
        !player ||
        player.locked ||
        player.finished
    ) {

        return;
    }


    player.locked =
        true;


    setButtonsEnabled(
        player,
        false
    );


    const question =
        QUESTIONS[
            player.questionIndex
        ];


    const correctAnswer =
        question[2];


    if (
        selectedAnswer ===
        correctAnswer
    ) {

        handleCorrect(
            player
        );

    } else {

        handleWrong(
            player,
            clickedButton
        );

    }
}


/* =========================================================
   정답 처리
========================================================= */

async function handleCorrect(player) {

    const card =
        document
            .getElementById(
                `player-card-${player.id}`
            );


    card
        .classList
        .remove(
            "wrong-flash"
        );


    void card.offsetWidth;


    card
        .classList
        .add(
            "correct-flash"
        );


    player.position++;


    updateProgress(
        player
    );


    moveRunner(
        player,
        true
    );


    document
        .getElementById(
            `status-${player.id}`
        )
        .textContent =
        "⭕ 맞았어요! 한 칸 앞으로!";


    if (
        player.position >=
        goalCount
    ) {

        await sleep(
            550
        );

        finishPlayer(
            player
        );

        return;
    }


    await sleep(
        650
    );


    loadNewQuestion(
        player
    );
}


/* =========================================================
   오답 처리
========================================================= */

async function handleWrong(
    player,
    clickedButton
) {

    player.wrongCount++;


    const card =
        document
            .getElementById(
                `player-card-${player.id}`
            );


    card
        .classList
        .remove(
            "wrong-flash"
        );


    void card.offsetWidth;


    card
        .classList
        .add(
            "wrong-flash"
        );


    /* -----------------------------------------
       첫 번째 오답
       틀린 보기 삭제 + 3초 정지
    ----------------------------------------- */

    if (
        player.wrongCount === 1
    ) {

        playWrongSound();


        /* 누른 틀린 보기 즉시 제거 */
        clickedButton
            .classList
            .add(
                "removed"
            );


        await showPenalty(
            player,
            "🤔",
            "틀린 보기가 사라졌어요!"
        );


        player.locked =
            false;


        setButtonsEnabled(
            player,
            true
        );


        document
            .getElementById(
                `status-${player.id}`
            )
            .textContent =
            "남은 두 보기 중에서 다시 생각해 보세요!";


        return;
    }


    /* -----------------------------------------
       두 번째 오답
       출발점 복귀
    ----------------------------------------- */

    playReturnSound();


    player.position =
        0;


    updateProgress(
        player
    );


    moveRunner(
        player,
        false,
        true
    );


    await showPenalty(
        player,
        "🚨",
        "두 번 틀렸어요! 출발점으로 돌아갑니다!"
    );


    loadNewQuestion(
        player
    );
}


/* =========================================================
   페널티
========================================================= */

async function showPenalty(
    player,
    icon,
    text
) {

    const overlay =
        document
            .getElementById(
                `penalty-${player.id}`
            );

    const iconElement =
        document
            .getElementById(
                `penalty-icon-${player.id}`
            );

    const textElement =
        document
            .getElementById(
                `penalty-text-${player.id}`
            );

    const countElement =
        document
            .getElementById(
                `penalty-count-${player.id}`
            );


    iconElement.textContent =
        icon;


    textElement.textContent =
        text;


    overlay
        .classList
        .add(
            "show"
        );


    for (
        let number = 3;
        number >= 1;
        number--
    ) {

        countElement.textContent =
            number;


        await sleep(
            1000
        );
    }


    overlay
        .classList
        .remove(
            "show"
        );
}


/* =========================================================
   진행도
========================================================= */

function updateProgress(player) {

    document
        .getElementById(
            `progress-${player.id}`
        )
        .textContent =
        `${player.position} / ${goalCount}`;
}


/* =========================================================
   캐릭터 이동
========================================================= */

function moveRunner(
    player,
    jump = false,
    returning = false
) {

    const runner =
        document
            .getElementById(
                `runner-${player.id}`
            );


    const percentage =
        Math.min(
            100,
            (
                player.position /
                goalCount
            ) * 100
        );


    if (
        returning
    ) {

        runner
            .classList
            .add(
                "returning"
            );

    } else {

        runner
            .classList
            .remove(
                "returning"
            );

    }


    /* 결승 깃발을 가리지 않도록 약간 여유 */
    runner.style.left =
        `${percentage * 0.94}%`;


    if (
        jump
    ) {

        runner
            .classList
            .add(
                "jump"
            );


        setTimeout(
            () => {

                runner
                    .classList
                    .remove(
                        "jump"
                    );

            },
            350
        );

    }


    if (
        returning
    ) {

        setTimeout(
            () => {

                runner
                    .classList
                    .remove(
                        "returning"
                    );

            },
            1200
        );

    }
}


/* =========================================================
   결승 도착
========================================================= */

function finishPlayer(player) {

    if (
        player.finished
    ) {
        return;
    }


    player.finished =
        true;


    player.locked =
        true;


    player.finishTime =
        performance.now() -
        gameStartTime;


    setButtonsEnabled(
        player,
        false
    );


    moveRunner(
        player,
        true
    );


    playFinishSound();


    const card =
        document
            .getElementById(
                `player-card-${player.id}`
            );


    card
        .classList
        .add(
            "finish-card"
        );


    const questionBox =
        card
            .querySelector(
                ".question-box"
            );


    questionBox.innerHTML = `

        <div class="finish-message">

            🎉 결승점 도착!

            <div class="finish-time-big">

                ${
                    formatTime(
                        player.finishTime
                    )
                }

            </div>

        </div>

    `;


    document
        .getElementById(
            `status-${player.id}`
        )
        .textContent =
        "🏆 멋지게 완주했습니다!";


    if (
        players.every(
            player =>
                player.finished
        )
    ) {

        clearInterval(
            timerInterval
        );


        setTimeout(
            showFinalResult,
            1000
        );

    }
}


/* =========================================================
   결과
========================================================= */

function showFinalResult() {

    const sorted =
        [...players]
            .sort(
                (a,b) =>
                    a.finishTime -
                    b.finishTime
            );


    const list =
        document
            .getElementById(
                "resultList"
            );


    list.innerHTML =
        sorted.map(
            player => `

                <div class="result-row">

                    <span>

                        ${player.character}
                        ${player.name}

                    </span>

                    <span>

                        ${
                            formatTime(
                                player.finishTime
                            )
                        }

                    </span>

                </div>

            `
        ).join("");


    document
        .getElementById(
            "resultOverlay"
        )
        .classList
        .add(
            "show"
        );
}


/* =========================================================
   같은 설정으로 다시
========================================================= */

document
    .getElementById(
        "againBtn"
    )
    .addEventListener(
        "click",
        async () => {

            const ctx =
                getAudioContext();


            if (
                ctx.state ===
                "suspended"
            ) {

                await ctx.resume();

            }


            buildGame();


            document
                .getElementById(
                    "resultOverlay"
                )
                .classList
                .remove(
                    "show"
                );


            await startCountdown();


            beginRace();

        }
    );


/* =========================================================
   설정 화면
========================================================= */

function backToSetup() {

    clearInterval(
        timerInterval
    );


    document
        .getElementById(
            "resultOverlay"
        )
        .classList
        .remove(
            "show"
        );


    document
        .getElementById(
            "gameScreen"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "setupScreen"
        )
        .style.display =
        "flex";
}


document
    .getElementById(
        "setupBtn"
    )
    .addEventListener(
        "click",
        backToSetup
    );


document
    .getElementById(
        "quitBtn"
    )
    .addEventListener(
        "click",
        () => {

            if (
                confirm(
                    "게임을 끝내고 처음 화면으로 돌아갈까요?"
                )
            ) {

                backToSetup();

            }

        }
    );


/* =========================================================
   화면 크기 변경
========================================================= */

window.addEventListener(
    "resize",
    () => {

        players.forEach(
            player => {

                moveRunner(
                    player,
                    false
                );

            }
        );

    }
);

</script>
