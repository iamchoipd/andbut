<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             viewport-fit=cover"
>

<title>이어주는 말 달리기</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --blue: #2775ff;
    --green: #14a66a;
    --red: #e84b4b;
    --yellow: #ffc83d;
    --dark: #233044;
    --bg: #f2f6fb;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    background: var(--bg);
    color: var(--dark);
}

body {
    min-height: 100dvh;
    overflow-x: hidden;
}

button,
select {
    font: inherit;
}

/* =========================
   설정 화면
========================= */

#setupScreen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.setup-box {
    width: min(620px, 100%);
    background: white;
    border-radius: 28px;
    padding: 32px;
    box-shadow: 0 14px 40px rgba(0,0,0,.12);
}

.title {
    text-align: center;
    font-size: clamp(30px, 7vw, 52px);
    font-weight: 900;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    font-size: 18px;
    color: #647084;
    line-height: 1.6;
    margin-bottom: 30px;
}

.setting-group {
    margin: 20px 0;
}

.setting-group label {
    display: block;
    font-weight: 800;
    font-size: 19px;
    margin-bottom: 8px;
}

.setting-group select {
    width: 100%;
    padding: 16px;
    border: 2px solid #dce3ed;
    border-radius: 15px;
    background: white;
    font-size: 20px;
    font-weight: 800;
}

.rule-box {
    margin-top: 24px;
    background: #f4f8ff;
    border-radius: 18px;
    padding: 17px 20px;
    line-height: 1.8;
    font-size: 15px;
}

.rule-box strong {
    color: var(--blue);
}

#startBtn {
    width: 100%;
    border: 0;
    border-radius: 18px;
    padding: 19px;
    margin-top: 24px;
    background: var(--blue);
    color: white;
    font-size: 27px;
    font-weight: 900;
    cursor: pointer;
}

/* =========================
   게임
========================= */

#gameScreen {
    display: none;
    min-height: 100dvh;
}

#raceArea {
    position: sticky;
    top: 0;
    z-index: 50;
    background: white;
    border-bottom: 3px solid #dbe2eb;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
    padding: max(8px, env(safe-area-inset-top)) 12px 10px;
}

.race-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
}

.race-title {
    font-weight: 900;
    font-size: clamp(17px, 3vw, 24px);
}

.small-btn {
    border: 0;
    background: #edf2f8;
    color: #344054;
    border-radius: 10px;
    padding: 8px 12px;
    font-weight: 800;
}

#tracks {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.track-row {
    display: grid;
    grid-template-columns: 56px 1fr 60px;
    align-items: center;
    gap: 6px;
    min-height: 35px;
}

.track-name {
    text-align: center;
    font-weight: 900;
    font-size: 14px;
}

.track {
    position: relative;
    height: 28px;
    border-radius: 14px;
    background:
        repeating-linear-gradient(
            90deg,
            #f0f3f8 0,
            #f0f3f8 9%,
            #e3e8f0 9%,
            #e3e8f0 10%
        );
    border: 2px solid #d9e0e9;
}

.runner {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translate(-10%, -50%);
    font-size: 27px;
    transition: left .6s cubic-bezier(.22,.8,.28,1.2),
                transform .25s;
    z-index: 2;
}

.runner.jump {
    transform: translate(-10%, -80%) scale(1.18);
}

.runner.returning {
    transition: left 1.1s cubic-bezier(.7,0,.3,1);
}

.finish-flag {
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 22px;
}

.track-time {
    text-align: center;
    font-size: 13px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}

/* =========================
   문제
========================= */

#playersScroller {
    width: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 12px;
    -webkit-overflow-scrolling: touch;
}

#playersArea {
    display: flex;
    align-items: stretch;
    gap: 12px;
    min-height: calc(100dvh - 220px);
}

.player-card {
    flex:
        0 0
        calc(
            (100% - ((var(--player-count) - 1) * 12px))
            / var(--player-count)
        );

    min-width: 0;
    position: relative;
    background: white;
    border-radius: 22px;
    border: 3px solid transparent;
    padding: 14px;
    display: flex;
    flex-direction: column;
    scroll-snap-align: center;
    box-shadow: 0 5px 18px rgba(0,0,0,.08);
    overflow: hidden;
}

.player-card.correct-flash {
    animation: correctFlash .55s ease;
}

.player-card.wrong-flash {
    animation: wrongFlash .55s ease;
}

@keyframes correctFlash {
    30% {
        border-color: #2ac67d;
        background: #eafff4;
    }
}

@keyframes wrongFlash {
    30% {
        border-color: #ff6767;
        background: #fff0f0;
    }
}

.player-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.player-label {
    font-weight: 900;
    font-size: clamp(17px, 2vw, 24px);
}

.player-progress {
    font-weight: 900;
    color: var(--blue);
}

.question-box {
    background: #f7f9fc;
    border-radius: 18px;
    padding: 18px 12px;
    margin-bottom: 12px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 170px;
}

.question {
    text-align: center;
    font-size: clamp(20px, 2.2vw, 30px);
    font-weight: 800;
    line-height: 1.7;
    word-break: keep-all;
}

.blank {
    display: inline-block;
    padding: 1px 12px 3px;
    margin: 5px;
    border-radius: 10px;
    background: #fff1b9;
    color: #805c00;
}

.status {
    text-align: center;
    font-weight: 900;
    min-height: 31px;
    margin: 3px 0 9px;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.answer-btn {
    width: 100%;
    min-height: 58px;
    border: 0;
    border-radius: 15px;
    background: #eaf1ff;
    color: #165ed1;
    font-size: clamp(20px, 2.2vw, 28px);
    font-weight: 900;
}

.answer-btn:nth-child(2) {
    background: #fff1e4;
    color: #bc6018;
}

.answer-btn:nth-child(3) {
    background: #e7f8ef;
    color: #087848;
}

.answer-btn:disabled {
    opacity: .38;
}

.answer-btn.removed {
    display: none;
}

.penalty-overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: rgba(25,33,47,.86);
    color: white;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.penalty-overlay.show {
    display: flex;
}

.penalty-icon {
    font-size: 58px;
}

.penalty-text {
    font-size: clamp(22px, 3vw, 36px);
    font-weight: 900;
    margin: 10px;
}

.penalty-count {
    font-size: 60px;
    font-weight: 900;
    color: #ffd84d;
}

.finish-message {
    text-align: center;
    font-size: clamp(25px, 3vw, 40px);
    font-weight: 900;
}

.finish-time-big {
    color: #176ada;
    font-size: clamp(31px, 5vw, 55px);
    font-weight: 900;
}

/* =========================
   카운트다운 / 결과
========================= */

#countdownOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(17,25,38,.88);
    align-items: center;
    justify-content: center;
    color: white;
}

#countdownOverlay.show {
    display: flex;
}

#countdownText {
    font-size: clamp(90px,25vw,220px);
    font-weight: 1000;
}

.countdown-start {
    color: #ffe44f;
}

#resultOverlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1500;
    background: rgba(13,20,32,.85);
}

#resultOverlay.show {
    display: flex;
}

.result-box {
    width: min(550px,100%);
    background: white;
    border-radius: 27px;
    padding: 27px;
    text-align: center;
}

.result-title {
    font-size: 35px;
    font-weight: 1000;
    margin-bottom: 18px;
}

.result-row {
    display: flex;
    justify-content: space-between;
    background: #f4f7fb;
    border-radius: 13px;
    padding: 13px 15px;
    margin: 8px 0;
    font-weight: 900;
}

.result-actions {
    display: flex;
    gap: 9px;
    margin-top: 20px;
}

.result-actions button {
    flex: 1;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    font-weight: 900;
}

#againBtn {
    background: var(--blue);
    color: white;
}

#setupBtn {
    background: #e8edf4;
}

/* =========================
   모바일
========================= */

@media (max-width:800px) {

    .track-row {
        grid-template-columns: 46px 1fr 52px;
    }

    .track {
        height: 24px;
    }

    .runner {
        font-size: 24px;
    }

    #playersScroller {
        padding: 9px;
    }

    #playersArea {
        gap: 8px;
    }

    .player-card {
        flex: 0 0 92vw;
        min-height: calc(100dvh - 190px);
    }

    #playersArea[data-count="1"] .player-card {
        flex-basis: calc(100vw - 18px);
    }

    .answer-btn {
        min-height: 64px;
    }
}
</style>
</head>

<body>

<div id="setupScreen">
<div class="setup-box">

<h1 class="title">🏁 이어주는 말 달리기</h1>

<div class="subtitle">
그리고 · 그러나 · 그래서<br>
문장을 잘 읽고 결승점까지 달려 보세요!
</div>

<div class="setting-group">
<label>👥 참가 인원</label>

<select id="playerCount">
<option value="1" selected>1명</option>
<option value="2">2명</option>
<option value="3">3명</option>
<option value="4">4명</option>
<option value="5">5명</option>
</select>
</div>

<div class="setting-group">
<label>🏁 문제 수</label>

<option value="5" selected>5문제</option>

<option value="15">15문제</option>
<option value="20">20문제</option>

</div>

<div class="rule-box">
📖 문제를 <strong>3초 동안 읽어요.</strong><br>
❌ 첫 번째 오답은 <strong>틀린 보기가 사라지고 3초 정지!</strong><br>
🚨 같은 문제를 두 번 틀리면 <strong>출발점으로 돌아가요.</strong><br>
🏆 결승점에 도착하면 <strong>도착 시간을 기록해요.</strong><br>
📚 문제는 <strong>120문제</strong>가 준비되어 있어요.
</div>

<button id="startBtn">게임 시작</button>

</div>
</div>

<div id="gameScreen">

<div id="raceArea">

<div class="race-header">
<div class="race-title">🏃 이어주는 말 경주</div>
<button class="small-btn" id="quitBtn">처음으로</button>
</div>

<div id="tracks"></div>

</div>

<div id="playersScroller">
<div id="playersArea"></div>
</div>

</div>

<div id="countdownOverlay">
<div id="countdownText">3</div>
</div>

<div id="resultOverlay">

<div class="result-box">

<div class="result-title">🏆 모두 도착!</div>

<div id="resultList"></div>

<div class="result-actions">
<button id="againBtn">다시 하기</button>
<button id="setupBtn">설정 바꾸기</button>
</div>

</div>

</div>

/* =====================================================
   기본 설정
===================================================== */

const CHARACTERS = ["🐰","🐶","🐱","🐼","🦊"];
const ANSWERS = ["그리고","그러나","그래서"];

let playerCount = 1;
let goalCount = 5;
let players = [];

let gameStartTime = 0;
let timerInterval = null;
let audioContext = null;


/* =====================================================
   효과음
===================================================== */

function getAudioContext() {

    if (!audioContext) {
        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    return audioContext;
}


function tone(
    frequency,
    duration = .15,
    type = "sine",
    volume = .18,
    delay = 0
) {

    const ctx = getAudioContext();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = type;
    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime + delay
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        ctx.currentTime + delay + .015
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + delay + duration
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration + .03);
}


function playCountdownSound(number) {

    const frequencies = {
        3:440,
        2:500,
        1:580
    };

    tone(frequencies[number],.16);
}


function playStartSound() {
    tone(660,.13,"sine",.18,0);
    tone(880,.16,"sine",.18,.11);
    tone(1100,.25,"sine",.2,.23);
}


function playWrongSound() {
    tone(230,.15,"square",.07);
    tone(180,.2,"square",.06,.13);
}


function playReturnSound() {

    const ctx = getAudioContext();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        650,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        110,
        ctx.currentTime + .8
    );

    gain.gain.setValueAtTime(
        .1,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .85
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + .9);
}


function playFinishSound() {
    tone(523,.16,"sine",.15);
    tone(659,.16,"sine",.15,.13);
    tone(784,.16,"sine",.17,.26);
    tone(1047,.4,"sine",.2,.39);
}


/* =====================================================
   도구
===================================================== */

function shuffle(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];
    }

    return result;
}


function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );
}


function formatTime(ms) {

    const totalTenths =
        Math.floor(ms / 100);

    const minutes =
        Math.floor(totalTenths / 600);

    const seconds =
        Math.floor(
            (totalTenths % 600) / 10
        );

    const tenths =
        totalTenths % 10;

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0") +
        "." +
        tenths
    );
}


/* =====================================================
   게임 시작
===================================================== */

document
.getElementById("startBtn")
.addEventListener(
    "click",
    startGame
);


async function startGame() {

    playerCount =
        Number(
            document
            .getElementById("playerCount")
            .value
        );

    goalCount =
        Number(
            document
            .getElementById("goalCount")
            .value
        );

    const ctx = getAudioContext();

    if (ctx.state === "suspended") {
        await ctx.resume();
    }

    buildGame();

    document
        .getElementById("setupScreen")
        .style.display = "none";

    document
        .getElementById("gameScreen")
        .style.display = "block";

    await startCountdown();

    beginRace();
}


/* =====================================================
   게임 만들기
===================================================== */

function buildGame() {

    clearInterval(timerInterval);

    document
        .getElementById("resultOverlay")
        .classList.remove("show");

    const tracks =
        document.getElementById("tracks");

    const playersArea =
        document.getElementById("playersArea");

    tracks.innerHTML = "";
    playersArea.innerHTML = "";

    playersArea.style.setProperty(
        "--player-count",
        playerCount
    );

    playersArea.dataset.count =
        playerCount;

    players = [];


    for (
        let i = 0;
        i < playerCount;
        i++
    ) {

        const order =
            shuffle(
                Array.from(
                    {
                        length:
                            QUESTIONS.length
                    },
                    (_,index) => index
                )
            );

        const player = {

            id:i,

            name:
                `${i + 1}번`,

            character:
                CHARACTERS[i],

            position:0,

            wrongCount:0,

            questionIndex:null,

            questionOrder:order,

            questionCursor:0,

            locked:true,

            finished:false,

            finishTime:null

        };


        players.push(player);

        createTrack(player);
        createPlayerCard(player);
    }
}


/* =====================================================
   트랙
===================================================== */

function createTrack(player) {

    const row =
        document.createElement("div");

    row.className =
        "track-row";

    row.innerHTML = `

        <div class="track-name">
            ${player.name}
        </div>

        <div class="track">

            <div
                class="runner"
                id="runner-${player.id}"
            >
                ${player.character}
            </div>

            <div class="finish-flag">
                🏁
            </div>

        </div>

        <div
            class="track-time"
            id="track-time-${player.id}"
        >
            00:00.0
        </div>
    `;

    document
        .getElementById("tracks")
        .appendChild(row);
}

            </div>

            <div
                class="player-progress"

        </div>

        <div class="question-box">

            </div>

        </div>

        <div

        <div

            ${ANSWERS.map(answer => `

                    ${answer}

            `).join("")}

        </div>

        <div

        >

            <div

                id="penalty-icon-${player.id}"
            >
                ⏳
            </div>

            <div
                class="penalty-text"
                id="penalty-text-${player.id}"
            >
            </div>

            <div
                class="penalty-count"
                id="penalty-count-${player.id}"
            >

            </div>

        </div>
    `;

    document

        .appendChild(card);


    card
    .querySelectorAll(".answer-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                answerQuestion(
                    Number(
                        button.dataset.player
                    ),
                    button.dataset.answer,
                    button
                );
            }
        );
    });
}


/* =====================================================
   시작 카운트다운
===================================================== */

async function startCountdown() {

    const overlay =
        document.getElementById(
            "countdownOverlay"
        );

    const text =
        document.getElementById(
            "countdownText"
        );

    overlay.classList.add("show");


    for (
        let number = 3;
        number >= 1;
        number--
    ) {

        text.textContent = number;

        playCountdownSound(number);

        await sleep(1000);
    }


    text.textContent =
        "시작!";

    text.classList.add(
        "countdown-start"
    );

    playStartSound();

    await sleep(700);

    overlay.classList.remove("show");

    text.classList.remove(
        "countdown-start"
    );
}


/* =====================================================
   경기 시작
===================================================== */

function beginRace() {

    gameStartTime =
        performance.now();

    players.forEach(
        player =>
            loadNewQuestion(player)
    );

    timerInterval =
        setInterval(
            updateTimers,
            100
        );
}


/* =====================================================
   시간
===================================================== */

function updateTimers() {

    const now =
        performance.now();

    players.forEach(player => {

        const elapsed =
            player.finished
            ? player.finishTime
            : now - gameStartTime;

        document
            .getElementById(
                `track-time-${player.id}`
            )
            .textContent =
            formatTime(elapsed);
    });
}


/* =====================================================
   문제 선택
===================================================== */

function getNextQuestion(player) {

    if (
        player.questionCursor >=
        player.questionOrder.length
    ) {

        player.questionOrder =
            shuffle(
                Array.from(
                    {
                        length:
                            QUESTIONS.length
                    },
                    (_,index) => index
                )
            );

        player.questionCursor = 0;
    }

    const index =
        player.questionOrder[
            player.questionCursor
        ];

    player.questionCursor++;

    return index;
}


/* =====================================================
   새 문제
===================================================== */

function loadNewQuestion(player) {

    if (player.finished) return;

    player.questionIndex =
        getNextQuestion(player);

    player.wrongCount = 0;

    resetAnswerButtons(player);

    const question =
        QUESTIONS[
            player.questionIndex
        ];

    document
        .getElementById(
            `question-${player.id}`
        )
        .innerHTML = `

            <div>
                ${question[0]}
            </div>

            <div>

                <span class="blank">
                    ______
                </span>

                ${question[1]}

            </div>
        `;

    startReadingLock(player);
}


/* =====================================================
   버튼 초기화
===================================================== */

function resetAnswerButtons(player) {

    const buttons =
        document
        .getElementById(
            `answers-${player.id}`
        )
        .querySelectorAll(
            ".answer-btn"
        );

    buttons.forEach(button => {

        button
            .classList
            .remove("removed");
    });
}


/* =====================================================
   읽기 3초
===================================================== */

async function startReadingLock(player) {

    player.locked = true;

    setButtonsEnabled(
        player,
        false
    );

    const status =
        document.getElementById(
            `status-${player.id}`
        );


    for (
        let number = 3;
        number >= 1;
        number--
    ) {

        if (player.finished) return;

        status.textContent =
            `📖 문장을 읽어요 · ${number}`;

        await sleep(1000);
    }


    if (player.finished) return;

    player.locked = false;

    setButtonsEnabled(
        player,
        true
    );

    status.textContent =
        "👉 알맞은 말을 선택하세요!";
}


/* =====================================================
   버튼 활성화
===================================================== */

function setButtonsEnabled(
    player,
    enabled
) {

    const buttons =
        document
        .getElementById(
            `answers-${player.id}`
        )
        .querySelectorAll(
            ".answer-btn"
        );

    buttons.forEach(button => {

        if (
            !button
            .classList
            .contains("removed")
        ) {

            button.disabled =
                !enabled;
        }
    });
}


/* =====================================================
   정답 선택
===================================================== */

function answerQuestion(
    playerId,
    selectedAnswer,
    clickedButton
) {

    const player =
        players[playerId];

    if (
        !player ||
        player.locked ||
        player.finished
    ) {
        return;
    }

    player.locked = true;

    setButtonsEnabled(
        player,
        false
    );

    const question =
        QUESTIONS[
            player.questionIndex
        ];

    const correctAnswer =
        question[2];


    if (
        selectedAnswer ===
        correctAnswer
    ) {

        handleCorrect(player);

    } else {

        handleWrong(
            player,
            clickedButton
        );
    }
}


/* =====================================================
   정답
===================================================== */

async function handleCorrect(player) {

    const card =
        document.getElementById(
            `player-card-${player.id}`
        );

    card.classList.remove(
        "wrong-flash"
    );

    void card.offsetWidth;

    card.classList.add(
        "correct-flash"
    );

    player.position++;

    updateProgress(player);

    moveRunner(
        player,
        true
    );

    document
        .getElementById(
            `status-${player.id}`
        )
        .textContent =
        "⭕ 맞았어요! 앞으로!";


    if (
        player.position >=
        goalCount
    ) {

        await sleep(550);

        finishPlayer(player);

        return;
    }

    await sleep(650);

    loadNewQuestion(player);
}


/* =====================================================
   오답
===================================================== */

async function handleWrong(
    player,
    clickedButton
) {

    player.wrongCount++;

    const card =
        document.getElementById(
            `player-card-${player.id}`
        );

    card.classList.remove(
        "wrong-flash"
    );

    void card.offsetWidth;

    card.classList.add(
        "wrong-flash"
    );


    /* 첫 번째 오답 */

    if (
        player.wrongCount === 1
    ) {

        playWrongSound();

        clickedButton
            .classList
            .add("removed");

        await showPenalty(
            player,
            "🤔",
            "틀린 보기가 사라졌어요!"
        );

        player.locked = false;

        setButtonsEnabled(
            player,
            true
        );

        document
            .getElementById(
                `status-${player.id}`
            )
            .textContent =
            "남은 두 개 중에서 골라 보세요!";

        return;
    }


    /* 두 번째 오답 */

    playReturnSound();

    player.position = 0;

    updateProgress(player);

    moveRunner(
        player,
        false,
        true
    );

    await showPenalty(
        player,
        "🚨",
        "출발점으로 돌아가요!"
    );

    loadNewQuestion(player);
}


/* =====================================================
   페널티
===================================================== */

async function showPenalty(
    player,
    icon,
    text
) {

    const overlay =
        document.getElementById(
            `penalty-${player.id}`
        );

    document
        .getElementById(
            `penalty-icon-${player.id}`
        )
        .textContent =
        icon;

    document
        .getElementById(
            `penalty-text-${player.id}`
        )
        .textContent =
        text;

    const count =
        document.getElementById(
            `penalty-count-${player.id}`
        );

    overlay.classList.add("show");


    for (
        let number = 3;
        number >= 1;
        number--
    ) {

        count.textContent =
            number;

        await sleep(1000);
    }


    overlay.classList.remove("show");
}


/* =====================================================
   진행 표시
===================================================== */

function updateProgress(player) {

    document
        .getElementById(
            `progress-${player.id}`
        )
        .textContent =
        `${player.position} / ${goalCount}`;
}


/* =====================================================
   캐릭터 이동
===================================================== */

function moveRunner(
    player,
    jump = false,
    returning = false
) {

    const runner =
        document.getElementById(
            `runner-${player.id}`
        );

    const percentage =
        Math.min(
            100,
            (
                player.position /
                goalCount
            ) * 100
        );


    if (returning) {
        runner.classList.add(
            "returning"
        );
    } else {
        runner.classList.remove(
            "returning"
        );
    }


    runner.style.left =
        `${percentage * .94}%`;


    if (jump) {

        runner.classList.add(
            "jump"
        );

        setTimeout(
            () =>
                runner
                .classList
                .remove("jump"),
            350
        );
    }


    if (returning) {

        setTimeout(
            () =>
                runner
                .classList
                .remove("returning"),
            1200
        );
    }
}


/* =====================================================
   도착
===================================================== */

function finishPlayer(player) {

    if (player.finished) return;

    player.finished = true;
    player.locked = true;

    player.finishTime =
        performance.now() -
        gameStartTime;

    setButtonsEnabled(
        player,
        false
    );

    moveRunner(
        player,
        true
    );

    playFinishSound();


    const card =
        document.getElementById(
            `player-card-${player.id}`
        );

    card
        .querySelector(
            ".question-box"
        )
        .innerHTML = `

            <div class="finish-message">

                🎉 결승점 도착!

                <div class="finish-time-big">
                    ${
                        formatTime(
                            player.finishTime
                        )
                    }
                </div>

            </div>
        `;


    document
        .getElementById(
            `status-${player.id}`
        )
        .textContent =
        "🏆 잘했어요!";


    if (
        players.every(
            p => p.finished
        )
    ) {

        clearInterval(
            timerInterval
        );

        setTimeout(
            showFinalResult,
            1000
        );
    }
}


/* =====================================================
   결과
===================================================== */

function showFinalResult() {

    const sorted =
        [...players]
        .sort(
            (a,b) =>
                a.finishTime -
                b.finishTime
        );

    document
        .getElementById(
            "resultList"
        )
        .innerHTML =
        sorted.map(
            player => `

                <div class="result-row">

                    <span>
                        ${player.character}
                        ${player.name}
                    </span>

                    <span>
                        ${
                            formatTime(
                                player.finishTime
                            )
                        }
                    </span>

                </div>

            `
        ).join("");


    document
        .getElementById(
            "resultOverlay"
        )
        .classList.add("show");
}


/* =====================================================
   다시 하기
===================================================== */

document
.getElementById("againBtn")
.addEventListener(
    "click",
    async () => {

        buildGame();

        document
            .getElementById(
                "resultOverlay"
            )
            .classList.remove("show");

        await startCountdown();

        beginRace();
    }
);


/* =====================================================
   처음 화면
===================================================== */

function backToSetup() {

    clearInterval(
        timerInterval
    );

    document
        .getElementById(
            "resultOverlay"
        )
        .classList.remove("show");

    document
        .getElementById(
            "gameScreen"
        )
        .style.display =
        "none";

    document
        .getElementById(
            "setupScreen"
        )
        .style.display =
        "flex";
}


document
.getElementById("setupBtn")
.addEventListener(
    "click",
    backToSetup
);


document
.getElementById("quitBtn")
.addEventListener(
    "click",
    () => {

        if (
            confirm(
                "게임을 끝내고 처음으로 돌아갈까요?"
            )
        ) {

            backToSetup();
        }
    }
);

</script>
